<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAT SOCIAL | Secure Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #1e40af, #0f172a, #020617);
            color: white;
            min-height: screen;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transition: all 0.3s transform;
        }
        .btn-gradient:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }
        .hidden { display: none; }
    </style>
</head>
<body class="flex items-center justify-center p-4 md:p-10">

    <!-- Background Elements -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-600/20 blur-[120px] rounded-full"></div>
    </div>

    <div class="w-full max-w-5xl flex flex-col md:flex-row glass-panel rounded-[2rem] overflow-hidden">
        
        <!-- SIDEBAR BRANDING -->
        <div class="md:w-5/12 bg-white/5 p-12 flex flex-col justify-between border-r border-white/10">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tighter leading-none mb-2">
                    FAT <span class="text-blue-500">SOCIAL</span>
                </h1>
                <p class="text-xs uppercase tracking-[0.3em] text-blue-400 font-semibold mb-10">International Asset Terminal</p>
                
                <div class="space-y-6">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-400">✓</div>
                        <p class="text-sm text-slate-300">Military-grade account encryption</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-400">⚡</div>
                        <p class="text-sm text-slate-300">Instant off-ramp utility</p>
                    </div>
                </div>
            </div>

            <div class="mt-20">
                <p class="text-[10px] text-slate-500 uppercase font-mono tracking-widest">System Status: Operational</p>
                <div class="w-full bg-white/10 h-1 mt-2 rounded-full overflow-hidden">
                    <div class="bg-blue-500 h-full w-[85%]"></div>
                </div>
            </div>
        </div>

        <!-- FORM SECTION -->
        <div class="md:w-7/12 p-8 md:p-16">
            
            <!-- LOGIN SECTION -->
            <div id="login-section" class="animate-in fade-in duration-700">
                <h2 class="text-3xl font-extrabold mb-2">Sign In</h2>
                <p class="text-slate-400 text-sm mb-10">Access your global digital vault</p>

                <form class="space-y-5">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Identity</label>
                        <input type="text" placeholder="Username or Email" class="w-full p-4 rounded-2xl input-glass outline-none font-semibold text-sm mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Access Key</label>
                        <input type="password" placeholder="••••••••" class="w-full p-4 rounded-2xl input-glass outline-none font-semibold text-sm mt-1">
                    </div>
                    <button type="submit" class="w-full btn-gradient text-white font-bold py-5 rounded-2xl shadow-lg shadow-blue-500/20 uppercase tracking-widest text-sm mt-4">
                        Open Terminal
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-xs text-slate-500 uppercase font-bold">New to the network? 
                        <button onclick="toggleAuth('signup')" class="text-blue-400 hover:text-blue-300 ml-2 underline underline-offset-4">Create Account</button>
                    </p>
                </div>
            </div>

            <!-- SIGN UP SECTION -->
            <div id="signup-section" class="hidden animate-in fade-in duration-700">
                <h2 class="text-3xl font-extrabold mb-2">Register</h2>
                <p class="text-slate-400 text-sm mb-8">Initialize your global node</p>

                <form class="space-y-4">
                    <div class="flex gap-4">
                        <div class="w-1/2">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">First Name</label>
                            <input type="text" placeholder="John" class="w-full p-4 rounded-2xl input-glass outline-none font-semibold text-sm mt-1">
                        </div>
                        <div class="w-1/2">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Last Name</label>
                            <input type="text" placeholder="Doe" class="w-full p-4 rounded-2xl input-glass outline-none font-semibold text-sm mt-1">
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Unique Username</label>
                        <input type="text" placeholder="agent_node_01" class="w-full p-4 rounded-2xl input-glass outline-none font-semibold text-sm mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Email</label>
                        <input type="email" placeholder="agent@fatsocial.com" class="w-full p-4 rounded-2xl input-glass outline-none font-semibold text-sm mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Password</label>
                        <input type="password" placeholder="••••••••" class="w-full p-4 rounded-2xl input-glass outline-none font-semibold text-sm mt-1">
                    </div>
                    <button type="submit" class="w-full btn-gradient text-white font-bold py-5 rounded-2xl shadow-lg shadow-blue-500/20 uppercase tracking-widest text-sm mt-4">
                        Initialize Node
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-xs text-slate-500 uppercase font-bold">Already registered? 
                        <button onclick="toggleAuth('login')" class="text-blue-400 hover:text-blue-300 ml-2 underline underline-offset-4">Back to Login</button>
                    </p>
                </div>
            </div>

        </div>
    </div>

    <script>
        function toggleAuth(type) {
            const login = document.getElementById('login-section');
            const signup = document.getElementById('signup-section');
            if (type === 'signup') {
                login.classList.add('hidden');
                signup.classList.remove('hidden');
            } else {
                signup.classList.add('hidden');
                login.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
