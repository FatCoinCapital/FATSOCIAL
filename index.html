<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FATSOCIAL | Digital Asset Terminal</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Professional Bold Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        /* Neo-Brutalist elements */
        .neo-box { border: 3px solid #000; box-shadow: 10px 10px 0px #000; }
        .input-focus:focus { border-color: #1e40af; ring: 2px solid #1e40af; }
        .hidden { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- LEFT SIDE: Branding / Visual (Navy Blue) -->
    <section class="md:w-1/2 bg-[#1e40af] text-white p-12 flex flex-col justify-center items-center text-center">
        <div class="max-w-md">
            <h1 class="text-7xl font-[900] uppercase tracking-tighter mb-4 leading-none">FAT SOCIAL</h1>
            <div class="h-2 w-24 bg-white mb-6 mx-auto"></div>
            <p class="text-blue-100 font-bold uppercase tracking-widest text-sm">International Account Assets & Engagement</p>
            
            <div class="mt-12 hidden md:block">
                <div class="p-4 border-2 border-blue-400 bg-blue-900/30 text-left font-mono text-xs space-y-1">
                    <p class="text-blue-300 uppercase font-black">// System_Log</p>
                    <p>> AUTH_MODULE: READY</p>
                    <p>> ENCRYPTION: ACTIVE</p>
                    <p>> DATABASE: CONNECTED</p>
                </div>
            </div>
        </div>
    </section>

    <!-- RIGHT SIDE: Auth Forms (White) -->
    <section class="md:w-1/2 p-6 md:p-12 flex flex-col justify-center items-center">
        
        <!-- LOGIN SECTION -->
        <div id="login-section" class="w-full max-w-md bg-white p-8 md:p-10 neo-box">
            <h2 class="text-4xl font-[900] uppercase tracking-tight text-black mb-2">Sign In</h2>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-8">Access your digital vault</p>

            <form class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black uppercase mb-1">Username or Email</label>
                    <input type="text" placeholder="Enter credentials" class="w-full p-4 border-2 border-slate-200 outline-none input-focus font-bold transition-all">
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase mb-1">Password</label>
                    <input type="password" placeholder="••••••••" class="w-full p-4 border-2 border-slate-200 outline-none input-focus font-bold transition-all">
                </div>
                <button type="submit" class="w-full bg-[#1e40af] text-white font-black py-5 uppercase tracking-widest hover:bg-black transition-colors">
                    Login to Terminal
                </button>
            </form>

            <div class="mt-8 pt-6 border-t-2 border-slate-100 flex justify-between items-center">
                <span class="text-[10px] font-bold uppercase text-slate-400 italic">No account?</span>
                <button onclick="toggleAuth('signup')" class="text-xs font-black uppercase underline decoration-2 underline-offset-4 hover:text-[#1e40af]">Create Account</button>
            </div>
        </div>

        <!-- SIGN UP SECTION (Hidden by default) -->
        <div id="signup-section" class="w-full max-w-md bg-white p-8 md:p-10 neo-box hidden">
            <h2 class="text-4xl font-[900] uppercase tracking-tight text-black mb-2">Register</h2>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-8">Initialize your agent node</p>

            <form class="space-y-4">
                <!-- Names Side-by-Side -->
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-[10px] font-black uppercase mb-1">First Name</label>
                        <input type="text" placeholder="John" class="w-full p-4 border-2 border-slate-200 outline-none input-focus font-bold transition-all">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-[10px] font-black uppercase mb-1">Last Name</label>
                        <input type="text" placeholder="Doe" class="w-full p-4 border-2 border-slate-200 outline-none input-focus font-bold transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase mb-1">Username</label>
                    <input type="text" placeholder="fat_agent_01" class="w-full p-4 border-2 border-slate-200 outline-none input-focus font-bold transition-all">
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase mb-1">Email Address</label>
                    <input type="email" placeholder="agent@fatsocial.com" class="w-full p-4 border-2 border-slate-200 outline-none input-focus font-bold transition-all">
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase mb-1">Password</label>
                    <input type="password" placeholder="••••••••" class="w-full p-4 border-2 border-slate-200 outline-none input-focus font-bold transition-all">
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase mb-1">Retype Password</label>
                    <input type="password" placeholder="••••••••" class="w-full p-4 border-2 border-slate-200 outline-none input-focus font-bold transition-all">
                </div>

                <button type="submit" class="w-full bg-[#1e40af] text-white font-black py-5 uppercase tracking-widest hover:bg-black transition-colors">
                    Initialize Account
                </button>
            </form>

            <div class="mt-8 pt-6 border-t-2 border-slate-100 flex justify-between items-center">
                <span class="text-[10px] font-bold uppercase text-slate-400 italic">Existing user?</span>
                <button onclick="toggleAuth('login')" class="text-xs font-black uppercase underline decoration-2 underline-offset-4 hover:text-[#1e40af]">Back to Login</button>
            </div>
        </div>

    </section>

    <script>
        function toggleAuth(type) {
            const login = document.getElementById('login-section');
            const signup = document.getElementById('signup-section');

            if (type === 'signup') {
                login.classList.add('hidden');
                signup.classList.remove('hidden');
            } else {
                signup.classList.add('hidden');
                login.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
