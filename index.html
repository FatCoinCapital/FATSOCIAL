<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FATSOCIAL | Entry Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Neo-Brutalist styling with Blue/White palette */
        .neo-button { border: 3px solid #000; box-shadow: 5px 5px 0px #000; transition: 0.2s; }
        .neo-button:active { box-shadow: 0px 0px 0px #000; transform: translate(5px, 5px); }
        .input-field { border: 2px solid #cbd5e1; padding: 12px; border-radius: 0px; outline: none; }
        .input-field:focus { border-color: #1e40af; }
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Branding Section (Blue) -->
    <section class="bg-[#1e40af] text-white p-12 text-center flex-grow flex flex-col justify-center">
        <h1 class="text-6xl font-black italic tracking-tighter uppercase mb-4">FAT<span class="text-blue-200">SOCIAL</span></h1>
        <p class="text-blue-100 font-mono text-sm uppercase tracking-widest">Global Asset Access & Verification</p>
    </section>

    <!-- Entry Section (White) -->
    <section class="bg-white p-8 md:p-16 -mt-12 mx-auto max-w-lg w-full shadow-2xl border-t-4 border-black">
        <div id="auth-container">
            <h2 id="form-title" class="text-3xl font-black uppercase mb-2">Login</h2>
            <p id="form-subtitle" class="text-xs text-slate-500 mb-8 uppercase font-bold tracking-widest italic">Identity Verification Required</p>

            <form class="space-y-4">
                <input type="email" placeholder="Email Address" class="input-field w-full">
                <input type="password" placeholder="Secure Password" class="input-field w-full">
                
                <!-- This field only shows during "Create Account" -->
                <div id="signup-fields" class="hidden">
                    <input type="text" placeholder="Phone Number (For 2FA)" class="input-field w-full mt-4">
                </div>

                <button type="submit" class="neo-button w-full bg-[#1e40af] text-white font-black py-4 uppercase mt-6">
                    Enter Terminal
                </button>
            </form>

            <div class="mt-10 pt-6 border-t border-slate-200 flex justify-between items-center">
                <span id="toggle-label" class="text-xs font-bold text-slate-400 uppercase">New Agent?</span>
                <button onclick="toggleAuth()" id="toggle-btn" class="text-xs font-black uppercase underline underline-offset-4">Create Account</button>
            </div>
        </div>
    </section>

    <footer class="p-6 text-center text-[10px] text-slate-400 font-mono uppercase">
        System Status: <span class="text-green-600">Secure</span> | UTC: <span id="time"></span>
    </footer>

    <script>
        // Toggle Logic inspired by image.png
        let isLogin = true;
        function toggleAuth() {
            isLogin = !isLogin;
            const title = document.getElementById('form-title');
            const btn = document.getElementById('toggle-btn');
            const label = document.getElementById('toggle-label');
            const extraFields = document.getElementById('signup-fields');

            title.innerText = isLogin ? "Login" : "Sign Up";
            btn.innerText = isLogin ? "Create Account" : "Back to Login";
            label.innerText = isLogin ? "New Agent?" : "Already Registered?";
            extraFields.classList.toggle('hidden');
        }

        // Live Clock
        setInterval(() => {
            document.getElementById('time').innerText = new Date().toUTCString();
        }, 1000);
    </script>
</body>
</html>
